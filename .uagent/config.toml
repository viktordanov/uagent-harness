# Project configuration for this repository. It overrides the user file only
# because the user file lists this path under [projects] with trusted = true.

effort = "medium"

# Commands the agent never runs, whatever the sandbox or an approval says
# (embedded engine). Each entry is a command prefix; a rule matches every
# simple command in a pipeline or a list.
[approvals]
forbid = [
  "rm -rf /",
  "git push --force",
  "git push -f",
  "git reset --hard",
]
